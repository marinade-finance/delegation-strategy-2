[workspace]
members = [
    "api",
    "collect",
    "csv",
    "store",
    "check",
]
resolver = "2"

[workspace.dependencies]
# Common dependencies used across multiple crates
anyhow = "1.0.100"
log = "0.4.28"
env_logger = "0.11.8"
clap = { version = "4.5", features = ["derive", "env"] }
rust_decimal = { version = "1.26", features = ["db-postgres"] }
tokio = { version = "1", features = ["full"] }
tokio-postgres = { version = "0.7.7", features = ["with-chrono-0_4"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.8"
serde_json = "1.0"
bincode = "1.3.3"
reqwest = { version = "0.12.16", features = ["blocking", "json"] }
chrono = { version = "=0.4.39", features = ["serde"] }
openssl = "0.10.70"
postgres-openssl = "0.5.1"
borsh = "1.5"
csv = "1.1"
utoipa = { version = "5.4.0", features = ["chrono", "decimal"] }
solana-rpc-client = "4.4"
solana-rpc-client-api = "4.4"
solana-native-token = "3"
validator = { version = "0.20.0", features = ["derive"] }

include_dir = "0.7.4"

# API-specific dependencies
bytes = "1.11"
futures = { version = "0.3", default-features = false }
warp = { version = "0.4", features = ["server", "multipart"] }
prometheus = { version = "0.13.3", default-features = false }
lazy_static = "1.4.0"
regex = "1.7.2"

# Store-specific dependencies
redis-macros = "0.1.0"
redis = { version = "0.23.0", features = ["json"] }

# Collect-specific dependencies
solana-account = { version = "5", features = ["bincode"] }
solana-clock = "4"
solana-epoch-info = "3"
solana-pubkey = "4.4"
solana-sdk-ids = "3"
solana-slot-history = { version = "3", features = ["serde"] }
solana-stake-interface = { version = "5", features = ["serde"] }
solana-account-decoder = "4.4"
solana-config-interface = { version = "2", features = ["bincode"] }
solana-commitment-config = "3.1"
solana-feature-gate-interface = { version = "5", features = ["bincode"] }
bs58 = "0.5"
anchor-lang = "^0.31.1"
jito-tip-distribution = { git = "https://github.com/jito-foundation/jito-programs", rev = "8f55af0a9b31ac2192415b59ce2c47329ee255a2", features = ["no-entrypoint"] }
jito-priority-fee-distribution = { git = "https://github.com/jito-foundation/jito-programs", rev = "8f55af0a9b31ac2192415b59ce2c47329ee255a2", features = ["no-entrypoint"] }
google-cloud-bigquery = "0.15"
